[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "renderplan"
description = "Engine-neutral render profile, plan, preflight, manifest, and collection contracts for speech pipelines."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
renderplan = "renderplan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["renderplan*"]

[tool.setuptools.package-data]
renderplan = ["py.typed"]

[tool.setuptools_scm]
version_file = "renderplan/_version.py"
fallback_version = "0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 96

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["renderplan"]
